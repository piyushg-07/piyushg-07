<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Piyush Gupta — AI Engineer and Product Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>

    <!-- neural-net motif -->
    <g transform="translate(900 60)" stroke="#94a3b8" stroke-opacity="0.25" stroke-width="1.2">
      <line x1="0" y1="40" x2="140" y2="0"/><line x1="0" y1="40" x2="140" y2="100"/><line x1="0" y1="40" x2="140" y2="200"/>
      <line x1="0" y1="160" x2="140" y2="0"/><line x1="0" y1="160" x2="140" y2="100"/><line x1="0" y1="160" x2="140" y2="200"/>
      <line x1="140" y1="0" x2="280" y2="100"/><line x1="140" y1="100" x2="280" y2="100"/><line x1="140" y1="200" x2="280" y2="100"/>
    </g>
    <g transform="translate(900 60)">
      <circle cx="0" cy="40" r="9" fill="#22d3ee"/>
      <circle cx="0" cy="160" r="9" fill="#22d3ee"/>
      <circle cx="140" cy="0" r="9" fill="#818cf8"/>
      <circle cx="140" cy="100" r="9" fill="#818cf8"/>
      <circle cx="140" cy="200" r="9" fill="#818cf8"/>
      <circle cx="280" cy="100" r="12" fill="#e879f9"/>
      <circle cx="280" cy="100" r="22" fill="none" stroke="#e879f9" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
      <text x="80" y="104" fill="#94a3b8" font-size="20" letter-spacing="4" font-weight="600">HI, I'M</text>
      <text x="78" y="172" fill="#f8fafc" font-size="64" font-weight="700" letter-spacing="-1">Piyush Gupta</text>
      <rect x="80" y="194" width="88" height="4" rx="2" fill="url(#accent)"/>
      <text x="80" y="240" fill="url(#accent)" font-size="28" font-weight="600">AI Engineer · Product Engineer</text>
      <text x="80" y="276" fill="#64748b" font-size="17" font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace">LLM apps · RAG · Agents · Next.js · Node · Python</text>
    </g>
  </g>
</svg>
